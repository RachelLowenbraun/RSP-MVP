name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Sign APK
      run: |
        BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -n 1)

        keytool -genkey -v -keystore release.keystore \
          -alias rsp -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=RSP, OU=Dev, O=RSP, L=Test, S=Test, C=US"

        "${BUILD_TOOLS}zipalign" -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          rsp-timing-spike-aligned.apk

        "${BUILD_TOOLS}apksigner" sign \
          --ks release.keystore --ks-pass pass:android --key-pass pass:android \
          --ks-key-alias rsp \
          --out rsp-timing-spike.apk \
          rsp-timing-spike-aligned.apk
          
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rsp-timing-spike-apk
        path: rsp-timing-spike.apk
        retention-days: 30
